      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - name: Build ISO in Debian trixie container
        run: |
          chmod +x build.sh
          docker run --privileged -v "$PWD":/k -w /k debian:trixie bash -c \
            "apt-get update && apt-get install -y live-build imagemagick debian-archive-keyring && ./build.sh"

      - name: Diagnose ISO boot structure
        if: success()
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso
          shopt -s nullglob
          isos=( *.iso )
          if [ "${#isos[@]}" -ne 1 ]; then
            echo "Expected exactly one ISO; found ${#isos[@]}"
            ls -lh *.iso || true
            exit 1
          fi
          iso="${isos[0]}"
          echo "=== ISO size and type ==="
          ls -lh "$iso"
          file "$iso"
          echo "=== El Torito BIOS/UEFI boot entries ==="
          xorriso -indev "$iso" -report_el_torito as_mkisofs
          echo "=== Important boot files ==="
          xorriso -indev "$iso" -find / -type f -exec echo 2>&1 | grep -Ei '(/live/|vmlinuz|initrd|grub|isolinux|efi/boot|boot.catalog)' || true
          echo "=== ISO integrity listing ==="
          xorriso -indev "$iso" -toc
          echo "If no boot entry or no kernel/initrd appears above, the ISO build is not bootable."
          
      - name: Checksum
        run: |
          sudo chown -R "$USER" . || true
          ls -lh *.iso
          sha256sum *.iso | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: noeyeos-0.5-iso
          path: |
            *.iso
            SHA256SUMS
          compression-level: 0
          retention-days: 7